    <script>
      // Edge Copilot extension performance observer safety guard
      (function() {
        if (typeof window !== 'undefined' && window.performance) {
          var dummyEntry = { startTime: 0, duration: 0, name: '', entryType: 'navigation' };
          ['getEntriesByType', 'getEntriesByName', 'getEntries'].forEach(function(method) {
            if (typeof window.performance[method] === 'function') {
              var orig = window.performance[method];
              window.performance[method] = function() {
                try {
                  var res = orig.apply(this, arguments) || [];
                  if (typeof Proxy !== 'undefined') {
                    return new Proxy(res, {
                      get: function(target, prop) {
                        if ((prop === '0' || prop === 0) && (!target[0] || target.length === 0)) {
                          return dummyEntry;
                        }
                        var val = target[prop];
                        if (typeof val === 'function') return val.bind(target);
                        return val;
                      }
                    });
                  }
                  return res;
                } catch (e) {
                  return [dummyEntry];
                }
              };
            }
          });
        }
      })();
    </script>
